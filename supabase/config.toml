# =============================================================================
# Configuración local de Supabase — IPTV Manager
# -----------------------------------------------------------------------------
# Solo para desarrollo local (`supabase start`). No contiene secretos ni
# referencias a un proyecto remoto: `site_url` es un placeholder de localhost y
# debe reemplazarse por el dominio real de Cloudflare Pages al desplegar.
#
# Registro público deshabilitado: el panel es monousuario (docs/00-kickoff.md §4).
# =============================================================================

project_id = "iptv-manager"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# `supabase db reset` aplica seed.sql después de las migraciones.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
# Placeholder local. En producción: dominio de Cloudflare Pages (ADR-001).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
# OJO: esta clave controla que el proveedor de email esté habilitado (login).
# El registro público se cierra con [auth] enable_signup = false, no aquí.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false
