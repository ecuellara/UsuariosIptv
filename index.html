<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#191d24" />
    <meta
      name="description"
      content="Panel administrativo privado para clientes, cuentas IPTV, vencimientos y caja."
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>IPTV Manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M8 12h16v9H8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M13 26h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Tema antes del primer pintado: evita el destello y no depende de red.
      (function () {
        try {
          var stored = localStorage.getItem('iptv-manager-theme') || 'system'
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var density = localStorage.getItem('iptv-manager-density')
          if (density === 'compact' || density === 'comfortable') {
            document.documentElement.dataset.density = density
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
